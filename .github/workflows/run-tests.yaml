# .github/workflows/run-tests.yaml
name: test
on: [ push, pull_request ]
jobs:
  run-tests:
    strategy:
      fail-fast: false
      matrix:
        emacs-version:
          - '29.4'
          - '30.2'
          - '31.1'
          - snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Emacs
        uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs-version }}

      - name: Byte-compile
        run: make compile

      - name: Run tests
        env:
          ELPACMAN_INTEGRATION: '1'
        run: make test

      - name: Check that the committed completions are up to date
        run: |
          make completions
          git diff --exit-code -- completions/
